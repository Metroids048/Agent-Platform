            - heading "常见问题" [level=2] [ref=f2e2170]
          - generic [ref=f2e2171]:
            - generic [ref=f2e2172]:
              - generic [ref=f2e2173] [cursor=pointer]:
                - text: 如何安装 TS Code 扩展？
                - generic [ref=f2e2174]: +
              - generic [ref=f2e2175]: 可在 VS Code 扩展市场搜索「TS Code」安装，或在下载页获取 .vsix 安装包手动安装。详见下载页的三种安装方式。
            - generic [ref=f2e2176]:
              - generic [ref=f2e2177] [cursor=pointer]:
                - text: 支持哪些编辑器？
                - generic [ref=f2e2178]: +
              - generic [ref=f2e2179]: 当前版本仅支持 Visual Studio Code（含兼容 code-server 的远程/容器环境）。暂不提供其他 IDE 形态。
            - generic [ref=f2e2180]:
              - generic [ref=f2e2181] [cursor=pointer]:
                - text: 是否必须联网？数据会外传吗？
                - generic [ref=f2e2182]: +
              - generic [ref=f2e2183]: 是否联网取决于你配置的模型。TS Code 已移除云服务，可对接自托管 / 内网的 OpenAI 协议兼容模型，实现数据不出内网。
            - generic [ref=f2e2184]:
              - generic [ref=f2e2185] [cursor=pointer]:
                - text: 如何配置模型与提供商？
                - generic [ref=f2e2186]: +
              - generic [ref=f2e2187]: 在「设置 → 提供商」添加自定义 provider（填写 Base URL、API Key、模型），再到「设置 → 模型」为默认 / 小模型 / 补全 / 各模式选择模型。详见产品手册。
            - generic [ref=f2e2188]:
              - generic [ref=f2e2189] [cursor=pointer]:
                - text: 支持代码自动补全吗？
                - generic [ref=f2e2190]: +
              - generic [ref=f2e2191]: 支持。可在「设置 → 自动补全」开启内联补全，并配置自托管补全模型与端点风格。详见手册「自动补全」章节。
            - generic [ref=f2e2192]:
              - generic [ref=f2e2193] [cursor=pointer]:
                - text: 什么是 MCP？如何接入？
                - generic [ref=f2e2194]: +
              - generic [ref=f2e2195]: MCP（Model Context Protocol）用于让智能体调用外部工具与系统。可通过「配置文件」或「可视化向导」两种方式接入，详见手册。
            - generic [ref=f2e2196]:
              - generic [ref=f2e2197] [cursor=pointer]:
                - text: 配置和缓存存放在哪里？
                - generic [ref=f2e2198]: +
              - generic [ref=f2e2199]: TS Code 使用独立的 XDG 风格目录存放配置与缓存（Windows 为 %APPDATA%\ts-code，工作区局部配置在 .ts-code/），不会与其他 AI 编程工具相互影响。
            - generic [ref=f2e2200]:
              - generic [ref=f2e2201] [cursor=pointer]:
                - text: 默认语言是什么？如何切换？
                - generic [ref=f2e2202]: +
              - generic [ref=f2e2203]: 扩展首屏默认使用简体中文。如需切换英文或跟随 VS Code 显示语言，请在「设置 → 语言」中调整。
            - generic [ref=f2e2204]:
              - generic [ref=f2e2205] [cursor=pointer]:
                - text: 如何更新或卸载？
                - generic [ref=f2e2206]: +
              - generic [ref=f2e2207]: 扩展会自动检查更新，也可在扩展管理页手动更新到最新版本；卸载在扩展管理页移除后重启编辑器即可。

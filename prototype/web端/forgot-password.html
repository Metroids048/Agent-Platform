<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>敖钦 · 忘记密码</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css?v=user-v4-auth">
<script src="../assets/user-auth.js?v=user-v4-auth"></script>
</head>
<body class="aioq-page aioq-auth-page">
<div class="aioq-auth-shell">
  <div class="aioq-auth-card">
    <div class="aioq-auth-brand">
      <div class="aioq-brand-mark aioq-brand-mark--ao" aria-hidden="true">敖</div>
      <div>
        <strong>敖钦 AI 工作台</strong>
        <span>重置密码</span>
      </div>
    </div>
    <h1>忘记密码</h1>
    <p class="aioq-auth-hint">演示流程：填写邮箱与验证码后重置密码，完成后返回登录。</p>

    <div id="step1" class="aioq-auth-step">
      <form id="sendCodeForm" class="aioq-auth-form">
        <label>
          <span>企业邮箱</span>
          <input type="email" id="resetEmail" placeholder="name@company.com" required>
        </label>
        <p class="aioq-auth-error hidden" id="step1Error"></p>
        <button type="submit" class="btn btn-primary aioq-auth-submit">发送验证码</button>
      </form>
    </div>

    <div id="step2" class="aioq-auth-step hidden">
      <form id="verifyCodeForm" class="aioq-auth-form">
        <label>
          <span>验证码</span>
          <input type="text" id="resetCode" inputmode="numeric" maxlength="6" placeholder="6 位验证码" required>
        </label>
        <p class="aioq-auth-error hidden" id="step2Error"></p>
        <button type="submit" class="btn btn-primary aioq-auth-submit">下一步</button>
      </form>
    </div>

    <div id="step3" class="aioq-auth-step hidden">
      <form id="resetPasswordForm" class="aioq-auth-form">
        <label>
          <span>新密码</span>
          <input type="password" id="newPassword" autocomplete="new-password" placeholder="至少 8 位" required>
        </label>
        <label>
          <span>确认新密码</span>
          <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="再次输入新密码" required>
        </label>
        <p class="aioq-auth-error hidden" id="step3Error"></p>
        <button type="submit" class="btn btn-primary aioq-auth-submit">重置密码</button>
      </form>
    </div>

    <p class="aioq-auth-foot"><a href="login.html">返回登录</a></p>
  </div>
</div>
<script>
(function () {
  var email = '';
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var step3 = document.getElementById('step3');

  function showStep(n) {
    step1.classList.toggle('hidden', n !== 1);
    step2.classList.toggle('hidden', n !== 2);
    step3.classList.toggle('hidden', n !== 3);
  }

  document.getElementById('sendCodeForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var err = document.getElementById('step1Error');
    err.classList.add('hidden');
    email = document.getElementById('resetEmail').value.trim();
    if (!email) {
      err.textContent = '请输入邮箱';
      err.classList.remove('hidden');
      return;
    }
    showStep(2);
  });

  document.getElementById('verifyCodeForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var err = document.getElementById('step2Error');
    err.classList.add('hidden');
    if (!String(document.getElementById('resetCode').value).trim()) {
      err.textContent = '请输入验证码';
      err.classList.remove('hidden');
      return;
    }
    showStep(3);
  });

  document.getElementById('resetPasswordForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var err = document.getElementById('step3Error');
    err.classList.add('hidden');
    var result = UserAuth.resetPassword(
      email,
      document.getElementById('resetCode').value,
      document.getElementById('newPassword').value,
      document.getElementById('confirmPassword').value
    );
    if (!result.ok) {
      err.textContent = result.error;
      err.classList.remove('hidden');
      return;
    }
    location.href = 'login.html';
  });
})();
</script>
</body>
</html>

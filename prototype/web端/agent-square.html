<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>敖钦 · 智能体中心</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css?v=user-v3-ui">
<link rel="stylesheet" href="../assets/figma-capture.css">
<script src="../assets/user-auth.js?v=user-v4-auth"></script>
<script src="../assets/figma-capture.js"></script>
</head>
<body class="aioq-page aioq-square-page aioq-user-v2-page" data-user-nav="square">
<div class="aioq-shell aioq-shell--square aioq-user-shell" id="agentSquareRoot">
  <aside class="aioq-sidebar aioq-user-sidebar">
    <div class="aioq-brand">
      <div class="aioq-brand-mark aioq-brand-mark--ao" aria-hidden="true">敖</div>
      <div>
        <strong>敖钦 AI 工作台</strong>
        <span>智能体发现与选择</span>
      </div>
    </div>

    <nav class="aioq-sidebar-nav" aria-label="工作台导航">
      <a class="aioq-nav-item" href="index.html">
        <span class="aioq-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span>新对话</span>
      </a>

      <a class="aioq-nav-item active" href="agent-square.html" id="btnAgentSquareNav">
        <span class="aioq-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
        </span>
        <span>智能体中心</span>
      </a>
    </nav>

    <div class="aioq-sidebar-scroll">
      <section class="aioq-sidebar-block aioq-agents-sidebar-block">
        <div class="aioq-sidebar-block-title">智能体</div>
        <div class="aioq-sidebar-agent-list" id="sidebarAgentList"></div>
      </section>

      <section class="aioq-sidebar-block aioq-history-sidebar-block">
        <div class="aioq-sidebar-block-title">最近对话</div>
        <div class="aioq-sidebar-history-list" id="sidebarHistoryList"></div>
        <button class="aioq-sidebar-mini-action" type="button" id="btnHistory">查看全部历史</button>
      </section>
    </div>

    <div class="aioq-sidebar-bottom">
      <button class="aioq-footer-row" type="button" id="btnFeedbackBox">意见箱</button>
      <button class="aioq-footer-row" type="button" id="btnMessageCenter">消息中心</button>
      <a class="aioq-footer-row" href="专家工作台/workbench.html" id="btnExpertWorkbench">专家工作台</a>
      <button class="aioq-footer-row" type="button" id="btnHelp">帮助</button>
    </div>
  </aside>

  <main class="aioq-main aioq-square-main">
    <header class="aioq-topbar aioq-square-topbar">
      <button class="aioq-menu-button" type="button" id="btnCollapseSidebar" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="aioq-square-title">
        <h1>智能体中心</h1>
      </div>
    </header>

    <section class="aioq-square-content" aria-label="智能体">
      <div class="aioq-square-search-row">
        <label class="aioq-square-search">
          <span aria-hidden="true">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <input id="squareSearch" type="search" placeholder="搜索智能体名称、场景、分类或标签" aria-label="搜索智能体">
        </label>
      </div>

      <div class="aioq-square-banner-wrap" id="squareBannerWrap">
        <button type="button" class="aioq-banner-nav aioq-banner-nav--prev" id="squareBannerPrev" aria-label="上一张">‹</button>
        <section class="aioq-square-banner aioq-square-banner--user" id="squareBanner" aria-label="推荐轮播图"></section>
        <button type="button" class="aioq-banner-nav aioq-banner-nav--next" id="squareBannerNext" aria-label="下一张">›</button>
        <div class="aioq-square-banner-dots" id="squareBannerDots" aria-label="轮播导航"></div>
      </div>

      <nav class="aioq-square-tabs" aria-label="智能体中心主标签">
        <button type="button" class="active" data-square-tab="recommend">推荐</button>
        <button type="button" data-square-tab="all">全部</button>
        <button type="button" data-square-tab="mine">我的</button>
      </nav>

      <div class="aioq-square-category-row" id="squareCategoryFilters" aria-label="分类筛选"></div>

      <div class="aioq-square-editorial" id="squareEditorial" aria-live="polite"></div>

      <section class="aioq-square-section" id="squareSectionIntro"></section>
      <section class="aioq-square-grid" id="squareAgentGrid" aria-live="polite"></section>
      <div class="aioq-square-empty hidden" id="squareEmpty">暂无匹配的智能体</div>
    </section>
  </main>
</div>

<div class="modal-overlay hidden aioq-portal-stack-overlay" id="historyModal">
  <div class="modal-box modal-md aioq-stack-modal">
    <div class="aioq-stack-modal-head">
      <h2>历史对话</h2>
      <button type="button" class="icon-btn" id="btnCloseHistory" aria-label="关闭">×</button>
    </div>
    <div class="modal-body aioq-history-modal-body">
      <input type="search" class="aioq-history-search" id="historySearchInput" placeholder="搜索对话标题或智能体" aria-label="搜索历史记录">
      <div class="aioq-history-scroll" id="historyList"></div>
      <button type="button" class="btn btn-sm aioq-history-load-more hidden" id="btnHistoryLoadMore">加载更多</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden aioq-portal-stack-overlay" id="historyDeleteConfirmModal">
  <div class="modal-box modal-sm">
    <div class="modal-header">
      <h2>删除对话</h2>
      <button type="button" class="close" id="btnCloseHistoryDelete" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <p class="aioq-muted">删除后无法恢复，确定要删除这条历史对话吗？</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btnCancelHistoryDelete">取消</button>
      <button type="button" class="btn btn-danger" id="btnConfirmHistoryDelete">删除</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden aioq-portal-stack-overlay" id="historySummaryModal">
  <div class="modal-box modal-lg aioq-summary-modal">
    <div class="aioq-stack-modal-head">
      <div>
        <h2>保存笔记</h2>
        <p>系统将整段对话生成总结笔记，保存后可在我的空间查看。</p>
      </div>
      <button type="button" class="icon-btn" id="btnCloseHistorySummary" aria-label="关闭">×</button>
    </div>
    <div class="modal-body aioq-summary-modal-body">
      <label class="aioq-summary-title-field">
        <span>笔记标题</span>
        <input type="text" id="historySummaryTitle" maxlength="80" placeholder="输入笔记标题">
      </label>
      <div class="aioq-summary-transcript" id="historySummaryTranscript"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btnCancelHistorySummary">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveHistorySummary">保存笔记</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden aioq-portal-stack-overlay" id="historyAgentModal">
  <div class="modal-box modal-lg aioq-summary-modal aioq-agent-modal">
    <div class="aioq-stack-modal-head">
      <div>
        <h2>保存个人智能体</h2>
        <p>模型将根据整段对话总结、精炼为标准系统提示词，保存后可在我的空间查看。</p>
      </div>
      <button type="button" class="icon-btn" id="btnCloseHistoryAgent" aria-label="关闭">×</button>
    </div>
    <div class="modal-body aioq-agent-modal-body">
      <p class="aioq-agent-source" id="historyAgentSource"></p>
      <label class="aioq-agent-field">
        <span>智能体名称</span>
        <input type="text" id="historyAgentName" maxlength="40" placeholder="输入智能体名称">
      </label>
      <label class="aioq-agent-field">
        <span>一句话简介</span>
        <input type="text" id="historyAgentIntro" maxlength="80" placeholder="输入简介">
      </label>
      <label class="aioq-agent-field">
        <span>系统提示词</span>
        <textarea id="historyAgentPrompt" rows="6" placeholder="系统将根据对话自动提炼"></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btnCancelHistoryAgent">取消</button>
      <button type="button" class="btn btn-primary" id="btnSaveHistoryAgent">保存</button>
    </div>
  </div>
</div>

<script src="../assets/proto.js"></script>
<script src="../assets/org-access-picker.js"></script>
<script src="../assets/platform-api.js"></script>
<script src="../assets/user-portal-context.js?v=user-v3-ui"></script>
<script src="../assets/user-personal-space.js?v=user-v3-ui"></script>
<script src="../assets/user-chat-portal.js?v=user-v3-ui"></script>
<script src="../assets/user-agent-resolver.js?v=user-v3-ui"></script>
<script src="../assets/user-feedback-form.js?v=user-v3-ui"></script>
<script src="../assets/user-message-center.js?v=user-v3-ui"></script>
<script src="../assets/user-portal-bridge.js?v=user-v3-ui"></script>
<script src="../assets/user-agent-square.js?v=user-v3-ui"></script>
<script>
  UserPortalBridge.mountSidebar();
</script>
</body>
</html>

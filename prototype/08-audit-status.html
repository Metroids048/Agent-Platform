<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>审核进度 · 运营平台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-ops-module="ops" data-ops-page="08-audit-status.html">
<header class="topbar"></header>
<div class="app-frame"><div class="layout">
  <aside class="sidebar"></aside>
  <main class="main audit-review-page">
    <div class="breadcrumb">
      <a href="05-agent-detail.html" id="breadcrumbDetail">智能体详情</a><span class="sep">›</span>
      <span class="current">审核进度</span>
    </div>
    <div class="page-header">
      <div><h1 id="statusTitle">审核进度</h1>
        <p style="font-size:13px;color:var(--text-muted);">申请人视角 · 提交后可在此查看审核流程</p>
      </div>
    </div>
    <div id="statusContent"></div>
  </main>
</div></div>
<script src="assets/proto.js"></script>
<script src="assets/ops-platform-shell.js"></script>
<script src="assets/ops-message-center.js"></script>
<script>
  if (window.OpsShell && OpsShell.initShell) {
    OpsShell.initShell({ module: 'ops', activePage: '08-audit-status.html' });
  }
  Proto.initTopbar('ops');

  var id = Proto.params().get('id') || Proto.agentId();
  var st = Proto.getState(id);
  var item = Proto.getAuditItem(id);
  var agentName = (item && item.name) || Proto.params().get('name') || id;

  document.getElementById('breadcrumbDetail').href = Proto.href('05-agent-detail.html', { id: id, name: agentName, type: Proto.params().get('type') || 'qa' });
  document.getElementById('statusTitle').textContent = agentName + ' · 审核进度';

  var step = st.auditStep != null ? st.auditStep : (item && item.auditStep) || 1;
  var statusLabel = st.status === 'rejected' ? '已驳回' : (st.status === 'published' ? '已通过' : '审核中');
  var scopeText = st.shareMode === 'public' || st.scope === 'public' ? '全公司' : (st.shareMode === 'specific' || st.scope === 'specific' ? '部门共享' : '仅本人');

  var root = document.getElementById('statusContent');
  root.innerHTML =
    '<div class="audit-stepper" id="statusStepper">' +
      '<div class="audit-step done" data-step="0"><div class="dot">✓</div><div class="label">提交申请</div><div class="sub">' + (st.auditSubmittedAt || (item && item.at) || '—') + '</div></div>' +
      '<div class="audit-step' + (st.status === 'review' ? ' current' : (st.status === 'published' ? ' done' : (st.status === 'rejected' ? ' fail' : ''))) + '" data-step="1">' +
        '<div class="dot">' + (st.status === 'published' ? '✓' : (st.status === 'rejected' ? '✕' : '2')) + '</div><div class="label">平台审核</div><div class="sub">' + statusLabel + '</div></div>' +
      '<div class="audit-step' + (st.status === 'published' ? ' done current' : '') + '" data-step="2">' +
        '<div class="dot">' + (st.status === 'published' ? '✓' : '3') + '</div><div class="label">已上架</div><div class="sub">' + (st.lastPublishedAt || st.publishedAt || '待通过') + '</div></div>' +
    '</div>' +
    '<section class="card" style="padding:20px;margin-top:16px;">' +
      '<p style="margin:0 0 8px;font-size:14px;"><strong>当前状态：</strong>' + statusLabel + '</p>' +
      '<p style="margin:0 0 8px;font-size:13px;color:var(--text-muted);">可见范围：' + scopeText + '</p>' +
      (st.rejectionReason ? '<p style="margin:0;color:var(--danger);font-size:13px;">驳回原因：' + String(st.rejectionReason).replace(/</g, '&lt;') + '</p>' : '') +
      (st.status === 'review' ? '<p style="margin:12px 0 0;font-size:13px;color:var(--text-muted);">审核一般 1–3 个工作日，通过后智能体将自动上架。</p>' : '') +
      '<p style="margin:12px 0 0;font-size:13px;color:var(--text-muted);">版本 ' + (st.releaseVersion || 'v1') + (st.releaseNote ? ' · ' + String(st.releaseNote).replace(/</g, '&lt;') : '') + '</p>' +
    '</section>' +
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">' +
      '<a class="btn btn-primary" href="' + Proto.href('05-agent-detail.html', { id: id, name: agentName }) + '">返回智能体详情</a>' +
      '<a class="btn" href="' + Proto.href('index.html') + '">返回列表</a>' +
    '</div>';
  if (typeof Proto.renderAuditStepper === 'function') {
    Proto.renderAuditStepper(step, '#statusStepper');
  }
</script>
</body>
</html>

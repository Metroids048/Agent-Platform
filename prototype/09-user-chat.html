<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>敖钦 · 用户对话入口</title>
<link rel="stylesheet" href="assets/style.css?v=user-v2-9fix">
<link rel="stylesheet" href="assets/figma-capture.css">
<script src="assets/figma-capture.js"></script>
<script>
(function () {
  if (/[?&]figma=1(?:&|$)/.test(location.search) || location.hash.indexOf('figmacapture=') >= 0) {
    var s = document.createElement('script');
    s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
    s.async = true;
    document.head.appendChild(s);
  }
})();
</script>
</head>
<body class="aioq-page">
<div class="aioq-legacy-banner" style="background:#e8f0fe;color:#0b3b8f;padding:8px 16px;font-size:13px;text-align:center;">
  新版用户端已迁移至 <a href="web端/index.html" style="color:#003da6;font-weight:600;">web端/index.html</a>（含三类智能体与专家工作台入口）。本页保留为极简旧入口。
</div>
<div class="aioq-shell" id="userChatRoot">
  <aside class="aioq-sidebar">
    <div class="aioq-brand">
      <div class="aioq-brand-mark aioq-brand-mark--ao" aria-hidden="true">敖</div>
      <div>
        <strong>敖钦</strong>
        <span>企业级中台</span>
      </div>
    </div>

    <button class="aioq-nav-item active" type="button" id="btnNewChat">
      <span class="aioq-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span>新对话</span>
    </button>
    <button class="aioq-nav-item muted" type="button">
      <span class="aioq-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M8 2.5l1.55 3.14 3.47.5-2.51 2.45.59 3.46L8 10.77l-3.1 1.28.59-3.46-2.51-2.45 3.47-.5L8 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </span>
      <span>个人智能体</span>
    </button>

    <div class="aioq-menu-block" id="agentMenuBlock">
      <button class="aioq-menu-head" type="button" id="btnToggleAgents">
        <span class="aioq-menu-head-label">
          <span class="aioq-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          </span>
          智能体中心
        </span>
        <span class="aioq-chevron" aria-hidden="true">⌄</span>
      </button>
      <button class="aioq-menu-head sub" type="button">
        <span>企业智能体</span>
        <span class="aioq-chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="aioq-agent-list" id="agentList"></div>
    </div>

    <div class="aioq-sidebar-bottom">
      <div class="aioq-search-wrap">
        <input class="aioq-search" id="agentSearch" placeholder="搜索智能体" aria-label="搜索智能体">
      </div>
      <button class="aioq-footer-row" type="button" id="btnHistory">
        <span>历史记录</span><span class="aioq-chevron">›</span>
      </button>
      <button class="aioq-footer-row" type="button" id="btnFeedbackEntry">意见箱</button>
      <button class="aioq-footer-row" type="button" id="btnHelp">帮助</button>
    </div>
  </aside>

  <main class="aioq-main">
    <header class="aioq-topbar">
      <button class="aioq-menu-button" type="button" id="btnCollapseSidebar" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="aioq-user-top-title">
        <span>用户对话入口</span>
        <strong>模型由对话参数内部路由，普通用户无需手动选择</strong>
      </div>
      <a class="aioq-top-link" href="web端/my-space.html">我的空间</a>
    </header>

    <section class="aioq-stage" id="chatStage">
      <div class="aioq-stage-scroll">
        <div class="aioq-welcome" id="welcomePanel">
          <div class="aioq-hero-title">
            <div class="aioq-hero-avatar" aria-hidden="true">
              <svg viewBox="0 0 56 56" width="56" height="56" fill="none">
                <rect width="56" height="56" rx="16" fill="#eef4ff"/>
                <path d="M14 34c5-7 10-10 14-10s9 3 14 10" stroke="#003da6" stroke-width="2" stroke-linecap="round"/>
                <circle cx="28" cy="22" r="4" fill="#003da6"/>
              </svg>
            </div>
            <h1 id="welcomeName">敖钦·智能助手</h1>
          </div>
          <p id="welcomeDesc">您好！我是基于敖钦平台搭建的企业 AI 助手，可结合企业知识库为您解答党建、财务、QHSE、勘探开发、钻完井等业务问题，很高兴为您服务。</p>
        </div>
        <div class="aioq-messages" id="chatMsgs"></div>
      </div>

      <div class="aioq-composer-wrap">
        <div class="skill-chip-list aioq-active-skills" id="sessionActiveSkills" style="display:none;"></div>
        <div class="aioq-composer">
          <textarea id="chatInput" rows="2" placeholder="输入你的问题，按 Enter 发送"></textarea>
          <div class="aioq-composer-actions">
            <button type="button" class="aioq-round-btn aioq-round-btn--skill" id="sessionSkillToggle" title="会话 Skills 增强" aria-label="会话 Skills 增强">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M8 4.5h8.5L18 7v10.8c0 .66-.54 1.2-1.2 1.2H8c-.66 0-1.2-.54-1.2-1.2V5.7c0-.66.54-1.2 1.2-1.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 5.5c-.8 0-1.2.5-1.2 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9.5 11c.9-.7 1.9-.7 2.8 0 .9.7 1.9.7 2.8 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6.8 18.2h10.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6.3 18.2c0 1.1.9 2 2 2h7.4c1.1 0 2-.9 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="aioq-round-btn" id="btnVoice" title="语音输入" aria-label="语音输入">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none"><rect x="7.5" y="3" width="5" height="9" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 10a5 5 0 0010 0M10 15v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="aioq-round-btn send" id="chatSend" title="发送" aria-label="发送">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4 10l12-6-6 12-1.5-5.5L4 10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="aioq-suggest-row">
          <p class="aioq-suggest-hint">你可以试着问：</p>
          <div class="aioq-suggest-chips" id="promptSuggestions"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="aioq-source-panel hidden" id="sourcePanel">
  <div class="aioq-floating-head">
    <strong>引用原文</strong>
    <button type="button" id="btnCloseSource" aria-label="关闭">×</button>
  </div>
  <div class="aioq-source-tools">
    <button type="button" aria-label="缩小">−</button>
    <span>100%</span>
    <button type="button" aria-label="放大">+</button>
    <button type="button" aria-label="刷新">↻</button>
    <button type="button" aria-label="下载">⇩</button>
  </div>
  <div class="aioq-source-empty">
    <div></div>
    <p>下载失败：未知错误</p>
    <button type="button" class="btn btn-sm" id="btnRetrySource">重试加载</button>
  </div>
</div>

<div class="modal-overlay hidden aioq-portal-stack-overlay" id="chatFeedbackModal">
  <div class="modal-box modal-md">
    <div class="modal-header">
      <h2>反馈</h2>
      <button type="button" class="close" id="btnCloseFeedback" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div id="chatFeedbackFormMount"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btnCancelFeedback">取消</button>
      <button type="button" class="btn btn-primary" id="btnSubmitFeedback">提交</button>
    </div>
  </div>
</div>

<script src="assets/proto.js"></script>
<script src="assets/platform-api.js"></script>
<script src="assets/user-feedback-form.js"></script>
<script src="assets/user-chat-portal.js?v=user-v2-9fix"></script>
<script>
  var sessionSkills = Proto.bindSessionSkills();
  (function mountLegacyFeedbackForm() {
    var mount = document.getElementById('chatFeedbackFormMount');
    if (mount && window.UserFeedbackForm) {
      mount.innerHTML = UserFeedbackForm.markup({
        hint: '您的反馈将帮助我们持续进步',
        placeholder: '你认为最优答案是什么？',
        textId: UserFeedbackForm.CHAT.textId,
        fileId: UserFeedbackForm.CHAT.fileId,
        listId: UserFeedbackForm.CHAT.listId
      });
      UserFeedbackForm.wire(UserFeedbackForm.CHAT);
    }
  })();
  UserChatPortal.init({ sessionSkills: sessionSkills });
</script>
</body>
</html>

name: Prototype verify

on:
  push:
    paths:
      - 'prototype/**'
  pull_request:
    paths:
      - 'prototype/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom for browser/navigation checks
        working-directory: prototype
        run: npm install jsdom --no-save

      - name: Run verify-all
        run: node prototype/scripts/verify-all.js
